<!DOCTYPE html>
<html>
<head>
    <title>Darryl Tan - Resume</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        .header {
            background: white;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .button {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 18px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .pdf-container {
            width: 100%;
            height: calc(100vh - 100px);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body>
    <div class="header">
        <h2>Darryl Tan - Resume</h2>
        <a class="button" href="resume.pdf" target="_blank">
            Open Resume
        </a>
    </div>

    <div class="pdf-container">
        <iframe src="resume.pdf"></iframe>
    </div>
</body>
</html>
